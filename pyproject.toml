[project]
name = "healthcare-data-validation"
version = "1.0.0"
description = "SQL data validation framework for a synthetic therapy practice-management database"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]  # Any is the honest type for database row values

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["ai: needs ANTHROPIC_API_KEY; skipped without it"]
